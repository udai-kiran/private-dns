server:
    # Enable recursive mode explicitly
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # Enable logging
    use-syslog: yes
    log-time-ascii: yes
    log-queries: yes
    log-replies: yes
    logfile: ""  # Empty logfile means use syslog

    # Logging verbosity (0-5, where 0 is least verbose)
    verbosity: 5

    # location of the trust anchor file that enables DNSSEC
    # auto-trust-anchor-file: "/var/lib/unbound/root.key"
    # send minimal amount of information to upstream servers to enhance privacy
    qname-minimisation: yes
    # the interface that is used to connect to the network (this will listen to all interfaces)
    interface: 0.0.0.0
    port: 8053
    # interface: ::0
    # addresses from the IP range that are allowed to connect to the resolver
    access-control: 10.0.0.0/8 allow
    access-control: 127.0.0.1/8 allow
    # access-control: 2001:DB8/64 allow

    # Cache settings
    cache-min-ttl: 300
    cache-max-ttl: 86400
    prefetch: yes
    prefetch-key: yes
    
    # Performance tuning
    num-threads: 2
    # msg-cache-size: 128m
    # rrset-cache-size: 256m
    so-rcvbuf: 4m
    so-sndbuf: 4m
    
    # Hide version number from clients
    hide-version: yes
    
    # Use 0x20-encoded random bits in the query to foil spoof attempts
    use-caps-for-id: yes

# remote-control:
#     # allows controling unbound using "unbound-control"
#     control-enable: yes
