apiVersion: v1
kind: Service
metadata:
  annotations:
    metallb.universe.tf/address-pool: default-addresspool
    metallb.universe.tf/allow-shared-ip: unbound-svc
  labels:
    app: unbound
  name: unbound-tcp
  namespace: private-dns
spec:
  externalTrafficPolicy: Local
  loadBalancerIP: 192.168.50.4
  ports:
  - name: dns
    port: 8053
    protocol: TCP
    targetPort: dns
  selector:
    app: unbound
  sessionAffinity: None
  type: LoadBalancer
